# Phase 10 (R3 実機対策版): R2 評価データ分析に基づく max_steps 再設計
# R2 知見:
#   - Navigate が最大のボトルネック（coffee/box 全滅）
#   - 成功 ep44 (mug pick): 242 frames, gripper mean≈0.44
#   - Place 成功率 0%（68 frames で即失敗）
# 方針: Navigate に十分な時間を確保 + gripper 閾値を実測値ベースに緩和

pa_monitor:
  gripper_close_threshold: 0.3
  gripper_open_threshold: 0.7
  joint_convergence_threshold: 0.06
  convergence_window: 10
  gripper_window: 5
  # R3-4: R2 成功パターン (mean≈0.44) に基づき閾値を緩和
  gripper_grasp_transition_threshold: -0.5   # -0.9 → -0.5
  gripper_place_transition_threshold: 0.5    # +0.9 → +0.5

  # 通常 max_steps（最後の PA で使用）
  max_steps:
    navigate: 250    # 200 → 250 (R3-3: Navigate 強化)
    grasp: 250
    place: 250       # 200 → 250 (R3-6: Place に余裕)
    open: 80
    close: 80
    default: 150

  # 途中 PA 用の短縮 max_steps
  max_steps_short:
    navigate: 200    # 150 → 200 (R3-3: Navigate は最重要)
    grasp: 150       # 125 → 150 (R3-5: Pick に時間確保)
    place: 150       # 100 → 150 (R3-6: Place を延長)
    open: 40
    close: 40
    default: 100     # 75 → 100

  # IM-2: 成功確認ウィンドウ（多数決で誤検出防止）
  # 実機では window=3, threshold=2 に設定推奨
  confirmation_window: 1
  confirmation_threshold: 1

  # VS-1: navigate 完了後にヘッドスキャン PA を自動挿入（Active Perception）
  insert_scan_after_navigate: false
  scan_pa_prompt: "Look around to find the target object"

  min_steps:
    navigate: 28
    go: 28
    move: 28
    return: 25
    grasp: 54
    grab: 54
    pick: 54
    place: 45
    store: 45
    put: 45
    drop: 45
    hang: 45
    open: 20
    close: 20
    default: 30

# --- アクション後処理 ---
postprocessor:
  gripper_clip: true           # グリッパー値をクリッピング
  gripper_clip_min: -1.0       # 学習分布 (v5 q01=-1.006) を保持、hybrid モード下では数値無視
  # R5: 1.0 → 1.23 (icra_2026_ramen#145) HSR 物理メカ限界 (1.239 rad = 全開)。
  # Run64/65 pred q99=+1.26 に対して旧 max=1.0 では close 側 28% を潰していた。
  gripper_clip_max: 1.23       # was 1.0 → 1.23 (R5 fix, icra_2026_ramen#145)
  gripper_binarize: false      # 明示的に OFF (serve_hsr_policy_ws.py デフォルト False と一致)
  # R5: hybrid モードの 0.5 境界振動抑制。chunk 境界で pred が 0.5 を跨ぐと
  # grasp action start/cancel と position 指令が交互に発行され、実機で振動・
  # 物体落下の原因となる。EMA window=5 decay=0.8 で抑制。
  temporal_ensemble: true
  ensemble_window: 5
  ensemble_decay: 0.8
  # R5: 運営 grasp action が既に力制御済みのため二重制御回避 (class default 明示化)
  gripper_force_guard: false
  gripper_contact_guard: false
  action_smoothing: true       # EMA アクションスムージング (Jerk -40%, MSE -6.8%)
  action_smoothing_alpha: 0.3  # EMA 係数 (0.3 = 強い平滑化, 1.0 = なし)
  action_smoothing_exclude_dims: [5]  # gripper はスムージング除外
